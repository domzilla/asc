name: Homebrew Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-bottles:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-26
            bottle_tag: arm64_tahoe
          - os: macos
            arch: x86_64
            runner: macos-26-intel
            bottle_tag: tahoe

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Verify binary
        run: .build/release/asc --version

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create bottle structure
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BOTTLE_DIR="asc/$VERSION"

          # Create Homebrew-style directory structure
          mkdir -p "$BOTTLE_DIR/bin"
          cp .build/release/asc "$BOTTLE_DIR/bin/"

      - name: Create bottle tarball
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BOTTLE_TAG=${{ matrix.bottle_tag }}

          tar -czf "asc-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" asc

          # Calculate SHA256
          shasum -a 256 "asc-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" > "asc-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz.sha256"

      - name: Upload bottle artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bottle-${{ matrix.bottle_tag }}
          path: |
            asc-*.bottle.tar.gz
            asc-*.bottle.tar.gz.sha256

  release:
    name: Create Release
    needs: build-bottles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: bottles
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: bottles/*
          generate_release_notes: true
          draft: false

      - name: Prepare bottle info
        id: bottles
        run: |
          cd bottles
          echo "arm64_sha=$(cat asc-${{ steps.version.outputs.version }}.arm64_tahoe.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_sha=$(cat asc-${{ steps.version.outputs.version }}.tahoe.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Output bottle info
        run: |
          echo "## Bottle SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add this to your formula:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```ruby' >> $GITHUB_STEP_SUMMARY
          echo "bottle do" >> $GITHUB_STEP_SUMMARY
          echo '  root_url "https://github.com/domzilla/asc/releases/download/${{ github.ref_name }}"' >> $GITHUB_STEP_SUMMARY
          echo '  sha256 cellar: :any_skip_relocation, arm64_tahoe: "${{ steps.bottles.outputs.arm64_sha }}"' >> $GITHUB_STEP_SUMMARY
          echo '  sha256 cellar: :any_skip_relocation, tahoe: "${{ steps.bottles.outputs.x86_64_sha }}"' >> $GITHUB_STEP_SUMMARY
          echo "end" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  update-formula:
    name: Update Homebrew Formula
    needs: [build-bottles, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: bottles
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Calculate source SHA256
        id: source
        run: |
          curl -sL "https://github.com/domzilla/asc/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          echo "sha256=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Get bottle SHA256s
        id: bottles
        run: |
          cd bottles
          echo "arm64_sha=$(cat asc-${{ steps.version.outputs.version }}.arm64_tahoe.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_sha=$(cat asc-${{ steps.version.outputs.version }}.tahoe.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: domzilla/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ github.ref_name }}
          SOURCE_SHA=${{ steps.source.outputs.sha256 }}
          ARM64_SHA=${{ steps.bottles.outputs.arm64_sha }}
          X86_64_SHA=${{ steps.bottles.outputs.x86_64_sha }}

          cat > homebrew-tap/Formula/asc.rb << 'FORMULA'
          class Asc < Formula
            desc "App Store Connect API client for AI agents, with a built-in blocklist"
            homepage "https://github.com/domzilla/asc"
            url "https://github.com/domzilla/asc/archive/refs/tags/TAG_PLACEHOLDER.tar.gz"
            sha256 "SOURCE_SHA_PLACEHOLDER"
            license "MIT"
            head "https://github.com/domzilla/asc.git", branch: "master"

            bottle do
              root_url "https://github.com/domzilla/asc/releases/download/TAG_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, arm64_tahoe: "ARM64_SHA_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, tahoe: "X86_64_SHA_PLACEHOLDER"
            end

            depends_on xcode: ["16.0", :build]
            depends_on :macos

            def install
              system "swift", "build", "-c", "release", "--disable-sandbox"
              bin.install ".build/release/asc"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/asc --version")
            end
          end
          FORMULA

          # Replace placeholders
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" homebrew-tap/Formula/asc.rb
          sed -i "s|SOURCE_SHA_PLACEHOLDER|${SOURCE_SHA}|g" homebrew-tap/Formula/asc.rb
          sed -i "s|ARM64_SHA_PLACEHOLDER|${ARM64_SHA}|g" homebrew-tap/Formula/asc.rb
          sed -i "s|X86_64_SHA_PLACEHOLDER|${X86_64_SHA}|g" homebrew-tap/Formula/asc.rb

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/asc.rb
          git commit -m "Update asc to ${{ steps.version.outputs.version }}"
          git push
