name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Verify binary
        run: .build/release/asc --version
